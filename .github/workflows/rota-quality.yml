name: ROTA - quality check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Validar JavaScript do servidor
        run: node --check server.js

      - name: Validar pacote
        run: node -e "const p=require('./package.json'); if(!p.scripts?.start) process.exit(1); console.log('ROTA package OK')"

      - name: Validar arquivos principais
        run: |
          test -f index.html
          test -f server.js
          test -f package.json
          echo "Arquivos principais do ROTA OK"
