name: ROTA 3D Auth
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 3D access screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='ROTA_AUTH_3D_V1'
          if marker in s:
              raise SystemExit(0)
          patch=r'''<!-- ROTA_AUTH_3D_V1 --><style>
          body:has(#authGate:not(.hidden)){overflow:hidden}
          .app:has(#authGate:not(.hidden))>header,.app:has(#authGate:not(.hidden))>.screen,.app:has(#authGate:not(.hidden))>.footer{visibility:hidden}
          .auth-gate{position:fixed!important;inset:0!important;z-index:1000!important;display:grid!important;place-items:center!important;padding:14px!important;overflow:auto!important;background:#020817!important;isolation:isolate}
          .auth-gate.hidden{display:none!important}
          .auth-gate:before{content:"";position:absolute;inset:-10%;z-index:-3;background:radial-gradient(circle at 18% 20%,#0ea5e955,transparent 22%),radial-gradient(circle at 82% 18%,#7c3aed55,transparent 20%),linear-gradient(135deg,#031329,#073563 48%,#020817);transform:scale(1.08);animation:rota3dbg 14s ease-in-out infinite alternate}
          .auth-gate:after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,#02081733,#020817e8)}
          .auth-3d-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;perspective:1200px;z-index:-1}
          .auth-orb{position:absolute;border-radius:50%;animation:rotaOrb 7s ease-in-out infinite;box-shadow:0 0 35px currentColor,inset -10px -12px 22px #0008}
          .auth-orb.o1{width:90px;height:90px;left:7%;top:15%;color:#22d3ee;background:radial-gradient(circle at 30% 25%,#e0fbff,#13b9ff 38%,#06426f 75%)}
          .auth-orb.o2{width:58px;height:58px;right:8%;top:22%;color:#ffd35b;background:radial-gradient(circle at 30% 25%,#fff4bd,#ffc83d 40%,#684200 78%);animation-delay:-2s}
          .auth-orb.o3{width:70px;height:70px;right:13%;bottom:14%;color:#a855f7;background:radial-gradient(circle at 30% 25%,#f4ddff,#a855f7 42%,#3a146d 78%);animation-delay:-4s}
          .auth-transport{position:absolute;font-size:48px;filter:drop-shadow(0 14px 22px #0009);animation:rotaVehicle 9s ease-in-out infinite;transform-style:preserve-3d}
          .auth-transport.t1{left:6%;bottom:16%}.auth-transport.t2{right:5%;bottom:28%;font-size:52px;animation-delay:-3s}.auth-transport.t3{right:17%;top:8%;font-size:54px;animation-delay:-6s}
          .auth-card{position:relative;z-index:3;width:min(520px,100%);max-height:calc(100vh - 28px);overflow:auto;background:linear-gradient(145deg,#071f41ee,#020f22f5)!important;border:1px solid #26c6ff99!important;border-radius:28px!important;box-shadow:0 30px 100px #000b,0 0 55px #00b7ff22,inset 0 1px 0 #fff2!important;backdrop-filter:blur(18px);animation:rotaCard .65s cubic-bezier(.2,.8,.2,1)}
          .auth-brandline{text-align:center;color:#7eeaff;font-size:10px;font-weight:900;letter-spacing:2px;margin-bottom:12px}
          @keyframes rota3dbg{from{transform:scale(1.06) translate3d(-1.5%,0,0)}to{transform:scale(1.14) translate3d(1.5%,-1%,0)}}
          @keyframes rotaOrb{0%,100%{transform:translate3d(0,0,90px) rotateY(0)}50%{transform:translate3d(0,-28px,170px) rotateY(24deg)}}
          @keyframes rotaVehicle{0%,100%{transform:translate3d(0,0,100px) rotateY(-10deg)}50%{transform:translate3d(26px,-34px,190px) rotateY(22deg) rotateZ(-6deg)}}
          @keyframes rotaCard{from{opacity:0;transform:translate3d(0,28px,20px) scale(.97)}to{opacity:1;transform:translate3d(0,0,90px) scale(1)}}
          @media(max-width:650px){.auth-card{padding:20px!important}.auth-orb.o1{left:-12%}.auth-transport.t3{right:6%;font-size:42px}}
          @media(prefers-reduced-motion:reduce){.auth-gate:before,.auth-orb,.auth-transport,.auth-card{animation:none!important}}
          </style><script>(function(){function setup(){var g=document.getElementById('authGate');if(!g)return;if(!g.querySelector('.auth-3d-scene')){var x=document.createElement('div');x.className='auth-3d-scene';x.innerHTML='<div class="auth-orb o1"></div><div class="auth-orb o2"></div><div class="auth-orb o3"></div><div class="auth-transport t1">🏍️</div><div class="auth-transport t2">🚛</div><div class="auth-transport t3">✈️</div>';g.prepend(x)}if(!g.querySelector('.auth-brandline')){var c=g.querySelector('.auth-card');if(c){var b=document.createElement('div');b.className='auth-brandline';b.textContent='ROTA • TUDO EM UM SÓ LUGAR';c.prepend(b)}}}setup();window.addEventListener('DOMContentLoaded',setup)})();</script>'''
          s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add 3D animated ROTA access screen [skip ci]" && git push