name: ROTA tracking UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ensure-tracking-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tracking script is loaded
        shell: bash
        run: |
          if [ ! -f index.html ]; then exit 0; fi
          if grep -q 'tracking-ui.js' index.html; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          if marker in s:
              s=s.replace(marker,'<script src="/tracking-ui.js"></script>\n'+marker,1)
          else:
              s += '\n<script src="/tracking-ui.js"></script>\n'
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'ROTA: load customer tracking UI' && git push)