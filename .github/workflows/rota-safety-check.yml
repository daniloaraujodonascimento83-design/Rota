name: ROTA safety checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f server.js
          test -f package.json
          test -f public/index.html || test -f index.html
      - name: Check JavaScript syntax
        run: node --check server.js
      - name: Check package manifest
        run: node -e "const p=require('./package.json'); if(!p.scripts||!p.scripts.start) process.exit(1); console.log('package.json OK')"
